<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Я БЫЛ ЗДЕСЬ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f2;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 18px 50px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 72px);
      letter-spacing: -3px;
      font-weight: 900;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 16px;
      color: #666;
    }

    .top-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .counter {
      text-align: center;
      margin: 15px 0;
      font-size: 13px;
      letter-spacing: 1px;
      color: #777;
    }

    #map {
      width: 100%;
      height: 600px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .form {
      max-width: 600px;
      margin: 25px auto 0;
      background: white;
      padding: 22px;
      border-radius: 16px;
      border: 1px solid #ddd;
    }

    .form h2 {
      margin-top: 0;
      font-size: 22px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #111;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: -5px;
      margin-bottom: 15px;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #555;
    }

    footer {
      text-align: center;
      margin-top: 35px;
      color: #999;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 10px 40px;
      }

      #map {
        height: 500px;
        border-radius: 14px;
      }

      .form {
        padding: 18px;
      }

      h1 {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Я БЫЛ ЗДЕСЬ</h1>
      <p class="subtitle">Оставь свой след на карте мира.</p>
    </header>

    <div class="top-buttons">
      <button onclick="showForm()">ОСТАВИТЬ СЛЕД</button>
      <button onclick="randomTrace()">СЛУЧАЙНЫЙ СЛЕД</button>
    </div>

    <div class="counter">
      СЛЕДОВ ОСТАВЛЕНО: <strong id="counter">0</strong>
    </div>

    <div id="map"></div>

    <div class="form" id="form" style="display:none;">

      <h2>Оставить свой след</h2>

      <input
        id="name"
        type="text"
        maxlength="40"
        placeholder="Твоё имя или никнейм"
      >

      <input
        id="city"
        type="text"
        maxlength="80"
        placeholder="Город"
      >

      <textarea
        id="message"
        maxlength="200"
        placeholder="Напиши что-нибудь..."
      ></textarea>

      <div class="hint">
        Например: «Был здесь летом 2026»
      </div>

      <button onclick="addTrace()">ОСТАВИТЬ СЛЕД</button>

      <div class="status" id="status"></div>

    </div>

    <footer>
      Ты был здесь. Теперь это осталось в интернете.
    </footer>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://uqbdfryvadbayvyianwi.supabase.co/rest/v1/16:30';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxYmRmcnl2YWRiYXl2eWlhbndpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzMxNzMsImV4cCI6MjEwNjk0OTE3M30.a01gGSCFwAnh8p0xs3vzgunbP3xTa19rzCPQWB56S3I16:30';

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

    // Создаём карту
    const map = L.map('map').setView([30, 10], 2);

    // Карта OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }
    ).addTo(map);

    // Временные тестовые следы
   let traces = [];

    const markers = [];

    function createMarker(trace) {

      const marker = L.marker([trace.lat, trace.lng])
        .addTo(map);

      marker.bindPopup(`
        <strong>${escapeHtml(trace.city)}</strong><br>
        ${escapeHtml(trace.name)}<br>
        <br>
        ${escapeHtml(trace.message)}
      `);

      markers.push(marker);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    traces.forEach(createMarker);
    loadTraces();

    updateCounter();

    function updateCounter() {
      document.getElementById('counter').textContent = traces.length;
  
    }
   async function loadTraces() {

  const { data, error } = await supabase
    .from('traces')
    .select('*')
    .order('created_at', { ascending: true });

  if (error) {
    console.error('Ошибка загрузки следов:', error);
    return;
  }

  traces = data || [];

  markers.forEach(marker => map.removeLayer(marker));
  markers.length = 0;

  traces.forEach(trace => {

    const marker = L.marker([
      trace.latitude,
      trace.longitude
    ]).addTo(map);

    marker.bindPopup(`
      <strong>${escapeHtml(trace.city)}</strong><br>
      ${escapeHtml(trace.name)}<br>
      <br>
      ${escapeHtml(trace.message)}
    `);

    markers.push(marker);

  });

  updateCounter();
}

    function showForm() {

      const form = document.getElementById('form');

      form.style.display = 'block';

      form.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }

    async function addTrace() {

  const name = document.getElementById('name').value.trim();
  const city = document.getElementById('city').value.trim();
  const message = document.getElementById('message').value.trim();

  const status = document.getElementById('status');

  if (!name  !city  !message) {
    status.textContent = 'Заполни все поля.';
    return;
  }

  status.textContent = 'Сохраняем след...';

  try {

    const response = await fetch(
      https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(city)}
    );

    const locations = await response.json();

    if (!locations.length) {
      status.textContent = 'Город не найден. Проверь название.';
      return;
    }

    const latitude = parseFloat(locations[0].lat);
    const longitude = parseFloat(locations[0].lon);

    const { data, error } = await supabase
      .from('traces')
      .insert([
        {
          name: name,
          city: city,
          message: message,
          latitude: latitude,
          longitude: longitude
        }
      ])
      .select()
      .single();

    if (error) {
      console.error(error);
      status.textContent = 'Ошибка сохранения следа.';
      return;
    }

    traces.push(data);

    createMarker({
      name: data.name,
      city: data.city,
      message: data.message,
      lat: data.latitude,
      lng: data.longitude
    });

    updateCounter();

    status.textContent = 'След оставлен!';

    document.getElementById('name').value = '';
    document.getElementById('city').value = '';
    document.getElementById('message').value = '';

  } catch (error) {

    console.error(error);
    status.textContent = 'Что-то пошло не так.';

  }

}
    function randomTrace() {

      if (markers.length === 0) return;

      const randomIndex =
        Math.floor(Math.random() * markers.length);

      const marker = markers[randomIndex];

      map.flyTo(
        marker.getLatLng(),
        7,
        {
          duration: 1.5
        }
      );

      setTimeout(() => {
        marker.openPopup();
      }, 1500);
    }

  </script>

</body>
</html>
